<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>都道府県・県庁所在地フラッシュカード</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#243447;--muted:#6b7785;--accent:#3b82f6;--line:#dbe3ec}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eef5ff,#f8fafc);color:var(--ink)}
.app{max-width:900px;margin:auto;padding:18px 16px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:clamp(20px,4vw,30px);margin:0;font-weight:800}.small{color:var(--muted);font-size:13px}
.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px rgba(40,70,100,.07)}
.modebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.modebtn{padding:16px 10px;border-radius:15px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:17px;cursor:pointer}
.modebtn.active{border-color:var(--accent);background:#eff6ff;color:#1d4ed8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:9px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:24px;min-height:490px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-shadow:0 14px 40px rgba(40,70,100,.09)}
.label{font-size:15px;color:var(--muted);margin-bottom:10px}.pref{font-size:clamp(42px,9vw,68px);font-weight:800;letter-spacing:.04em;text-align:center;min-height:85px;display:flex;align-items:center;justify-content:center}.answer{font-size:clamp(30px,7vw,54px);font-weight:800;color:#2f6fed;letter-spacing:.04em;text-align:center;min-height:75px;display:flex;align-items:center;justify-content:center}.hidden{visibility:hidden}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}button{border:0;border-radius:15px;padding:15px 12px;font-size:18px;font-weight:800;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}
.primary{background:var(--accent);color:#fff}.ok{background:#dcfce7;color:#166534}.ng{background:#fee2e2;color:#991b1b}.secondary{background:#eef2f7;color:#334155}button:disabled{opacity:.42;cursor:not-allowed}
.bottom{display:flex;gap:10px;margin-top:12px}.bottom button{flex:1;font-size:14px;padding:12px}.result{text-align:center;padding:28px 10px}.result h2{font-size:30px;margin:0 0 8px}.score{font-size:42px;font-weight:900;margin:10px 0}.note{color:var(--muted);line-height:1.7}
.history{margin-top:14px}.history h3{margin:0 0 8px}.history-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:13px}.history-row:last-child{border-bottom:0}
.weak{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:999px;padding:5px 9px;font-size:12px}
@media(max-width:600px){.app{padding:12px}.card{min-height:430px;padding:18px}.actions{gap:9px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app">
<header><h1>🗾 都道府県・県庁所在地フラッシュカード</h1><div class="small">18都道府県</div></header>
<div class="panel"><strong>モードを選ぶ</strong><div class="modebox"><button class="modebtn active" id="orderedMode">📋 順序どおり</button><button class="modebtn" id="randomMode">🔀 ランダム</button></div>
<div class="stats"><div class="stat"><b id="totalSessions">0</b><span>学習回数</span></div><div class="stat"><b id="bestScore">—</b><span>最高記録</span></div><div class="stat"><b id="streak">0</b><span>連続正解</span></div><div class="stat"><b id="weakCount">0</b><span>苦手な県</span></div></div></div>
<div class="panel" style="margin-top:12px"><div class="status"><div><strong id="mode">全18問</strong><div class="small" id="count">1 / 18</div></div><button class="secondary" id="resetBtn" style="padding:10px 14px;font-size:14px">↺ リセット</button></div><div class="progress"><div class="bar" id="bar"></div></div></div>
<div id="game"></div><div class="panel history" id="recordPanel"></div></div>
<script>
const ALL_CARDS=[["北海道", "札幌市"], ["岩手県", "盛岡市"], ["宮城県", "仙台市"], ["茨城県", "水戸市"], ["栃木県", "宇都宮市"], ["群馬県", "前橋市"], ["埼玉県", "さいたま市"], ["神奈川県", "横浜市"], ["石川県", "金沢市"], ["山梨県", "甲府市"], ["愛知県", "名古屋市"], ["三重県", "津市"], ["滋賀県", "大津市"], ["兵庫県", "神戸市"], ["島根県", "松江市"], ["香川県", "高松市"], ["愛媛県", "松山市"], ["沖縄県", "那覇市"]];
const KEY="prefCapitalRecordsV2";let currentMode="ordered",deck=[],index=0,sessionCorrect=0,wrong=[],revealed=false,isRetry=false;
const $=id=>document.getElementById(id);
function records(){try{return JSON.parse(localStorage.getItem(KEY))||{sessions:0,best:null,streak:0,weak:{},history:[]}}catch(e){return {sessions:0,best:null,streak:0,weak:{},history:[]}}}
function save(r){localStorage.setItem(KEY,JSON.stringify(r))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderRecords(){const r=records();$('totalSessions').textContent=r.sessions;$('bestScore').textContent=r.best===null?'—':`${r.best} / 18`;$('streak').textContent=r.streak;const weak=Object.entries(r.weak).sort((a,b)=>b[1]-a[1]);$('weakCount').textContent=weak.length;let h='<h3>学習記録</h3>';if(!r.history.length)h+='<div class="small">まだ記録はありません。</div>';else r.history.slice(0,8).forEach(x=>h+=`<div class="history-row"><span>${x.date}・${x.mode}</span><b>${x.score} / 18（${x.rate}%）</b></div>`);if(weak.length){h+='<div style="margin-top:14px"><h3>まちがえやすい都道府県</h3><div class="weak">';weak.slice(0,8).forEach(x=>h+=`<span class="chip">${x[0]}（${x[1]}回）</span>`);h+='</div></div>'}$('recordPanel').innerHTML=h}
function start(full=true){isRetry=!full;deck=full?(currentMode==='random'?shuffle(ALL_CARDS):[...ALL_CARDS]):[...wrong];index=0;sessionCorrect=0;wrong=[];revealed=false;showCard()}
function showCard(){if(index>=deck.length){finish();return};let [p,c]=deck[index];$('game').innerHTML=`<div class="card"><div class="label">この都道府県の県庁所在地は？</div><div class="pref">${p}</div><div class="answer hidden" id="answer">${c}</div></div><div class="actions" id="actions"><button class="primary" id="reveal">答えを見る</button></div>`;$('reveal').onclick=reveal;updateStatus()}
function reveal(){if(revealed)return;revealed=true;$('answer').classList.remove('hidden');$('actions').innerHTML='<button class="ok" id="yes">○ 正解</button><button class="ng" id="no">× まちがい</button>';$('yes').onclick=()=>judge(true);$('no').onclick=()=>judge(false)}
function judge(ok){if(ok)sessionCorrect++;else wrong.push(deck[index]);index++;revealed=false;showCard()}
function updateStatus(){$('mode').textContent=isRetry?`まちがい ${deck.length}問`:`全18問`;$('count').textContent=`${Math.min(index+1,deck.length)} / ${deck.length}`;$('bar').style.width=(index/deck.length*100)+'%'}
function finish(){$('bar').style.width='100%';$('count').textContent=`${deck.length} / ${deck.length}`;const rate=Math.round(sessionCorrect/deck.length*100);let out=`<div class="panel result"><h2>今回の結果</h2><div class="score">${sessionCorrect} / ${deck.length}</div><div class="note">正解率 ${rate}%<br>${wrong.length?`まちがいは ${wrong.length}問です。`:'全問正解！すばらしい！'}</div><div class="actions">${wrong.length?'<button class="primary" id="retryBtn">まちがえた問題だけ</button>':''}<button class="secondary" id="againBtn">もう一度18問</button></div></div>`;$('game').innerHTML=out;if($('retryBtn'))$('retryBtn').onclick=()=>start(false);$('againBtn').onclick=()=>start(true);if(!isRetry){let r=records();r.sessions++;r.best=r.best===null?sessionCorrect:Math.max(r.best,sessionCorrect);r.streak=wrong.length?0:r.streak+sessionCorrect;wrong.forEach(x=>r.weak[x[0]]=(r.weak[x[0]]||0)+1);r.history.unshift({date:new Date().toLocaleDateString('ja-JP'),mode:currentMode==='random'?'ランダム':'順序どおり',score:sessionCorrect,total:18,rate});r.history=r.history.slice(0,8);save(r);renderRecords()}}
$('orderedMode').onclick=()=>{currentMode='ordered';$('orderedMode').classList.add('active');$('randomMode').classList.remove('active');start(true)};
$('randomMode').onclick=()=>{currentMode='random';$('randomMode').classList.add('active');$('orderedMode').classList.remove('active');start(true)};
$('resetBtn').onclick=()=>{if(confirm('学習記録をすべて消して、最初から始めますか？')){localStorage.removeItem(KEY);renderRecords();start(true)}};
renderRecords();start(true);
</script></body></html>
